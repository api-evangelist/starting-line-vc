aid: starting-line-vc
name: Starting Line VC
description: >-
  Starting Line is a Chicago-based early-stage venture capital firm founded in 2018 by Ezra Galston that
  invests first checks into consumer technology startups nationwide. The firm concentrates on consumer AI,
  consumer health and longevity, Gen Alpha / Gen Z, consumer mobile, consumer fintech, and consumer
  marketplaces — as well as the infrastructure that supports them. Starting Line typically writes first
  checks of $500K-$1.5M (optimally $750K-$1.25M into a ~$2.5M seed round), maintains a roughly 2:1
  initial-to-reserves ratio, and makes about 6-8 new investments per year. It has raised three funds —
  Fund I ($17M, 2018), Fund II ($30M, 2021), and Fund III ($30M, 2023) — and is headquartered in Chicago
  with portfolio concentrations in Los Angeles, Austin, and New York. The firm is known for radical
  transparency, open-sourcing its operating manual, quarterly LP letters, and mental health policy on
  GitHub. Notable investments include Cameo, M1 Finance, Substack, Hungryroot, Shef, Soona, SpotHero
  (acquired by Uber), and Pretty Litter (acquired by Mars for ~$1B).
